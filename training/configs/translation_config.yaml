# ─────────────────────────────────────────────────────────────────────────────
# Translation Training Configuration
# mBART-50 + Adapter Layers
# Language Pairs: Vietnamese ↔ Ede, Vietnamese ↔ Bahnar
# ─────────────────────────────────────────────────────────────────────────────

model:
  base: facebook/mbart-large-50
  src_lang_vi: vi_VN
  src_lang_ede: ede_XX          # Custom token (added to tokenizer)
  src_lang_bah: bah_XX          # Custom token
  max_length: 512
  use_adapter: true
  adapter_size: 256
  adapter_dropout: 0.1
  num_adapter_layers: 6

language_pairs:
  - src: vi_VN
    tgt: ede_XX
    name: vi_to_ede
  - src: ede_XX
    tgt: vi_VN
    name: ede_to_vi
  - src: vi_VN
    tgt: bah_XX
    name: vi_to_bah
  - src: bah_XX
    tgt: vi_VN
    name: bah_to_vi

training:
  # ✅ Updated: batch_size=auto cho Colab T4
  batch_size: auto
  gradient_accumulation_steps: 8
  # ✅ Updated: 10 epochs thay vì 50 (demo corpus nhỏ)
  max_epochs: 10
  early_stopping_patience: 5
  learning_rate: 2.0e-5          # ✅ Updated: 2e-5 nhất quán với notebook 04
  optimizer: adamw
  weight_decay: 0.01
  scheduler: cosine
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  mixed_precision: fp16
  label_smoothing: 0.1
  # ✅ Updated: num_workers=0 cho Colab
  num_workers: 0
  pin_memory: false

low_resource:
  backtranslation: true
  backtranslation_weight: 0.5
  synthetic_generation: true
  data_augmentation: true
  curriculum_learning: true     # Start với high-confidence pairs
  cross_lingual_transfer: true  # Transfer từ Vi↔En
  min_pairs_threshold: 5        # ✅ Updated: 5 (demo corpus) thay vì 100

data:
  max_src_len: 128              # ✅ Updated: 128 (nhất quán với notebook 04)
  max_tgt_len: 128
  augment_src: true
  augment_tgt: false
  noise_prob: 0.1
  # ✅ Updated: đường dẫn corpus trên Drive
  corpus_dir: /content/drive/MyDrive/GenAI_ViMD/storage/corpora

evaluation:
  metrics:
    - bleu
    - chrf
    - ter
  target_bleu: 25.0            # BLEU target cho low-resource pairs

checkpointing:
  save_every_n_steps: 500
  keep_top_k: 3
  monitor_metric: bleu
  monitor_mode: max
  gdrive_sync: true
  # ✅ Updated: đúng tên folder trên Drive (GenAI_ViMD, không phải vietspeech_ai)
  gdrive_path: /content/drive/MyDrive/GenAI_ViMD/storage/checkpoints/translation
  export_dir: /content/drive/MyDrive/GenAI_ViMD/storage/weights/translation

logging:
  mlflow_experiment: translation_mbart
  mlflow_uri: /content/drive/MyDrive/GenAI_ViMD/storage/logs/mlflow
  log_every_n_steps: 50
