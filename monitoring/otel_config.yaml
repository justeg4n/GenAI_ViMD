receivers:
  - otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  resource:
    attributes:
      - key: service.name
        value: vietspeech-backend
        action: upsert
      - key: deployment.environment
        from_attribute: APP_ENV
        action: insert

  filter:
    error_mode: ignore
    traces:
      span:
        - 'name == "healthcheck"'

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: vietspeech

  jaeger:
    endpoint: "jaeger:14250"
    tls:
      insecure: true

  logging:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, filter, batch]
      exporters: [jaeger, logging]

    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [logging]
