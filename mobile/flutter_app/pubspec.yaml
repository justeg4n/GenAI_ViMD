name: vietspeech_mobile
description: VietSpeech AI — Vietnamese Multi-Dialect Speech AI Mobile App

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & WebSocket
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  dio: ^5.3.0

  # Audio recording & playback
  record: ^5.0.4
  audioplayers: ^5.2.1
  just_audio: ^0.9.36
  path_provider: ^2.1.1

  # State management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.2.0

  # Local storage
  shared_preferences: ^2.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  fl_chart: ^0.65.0

  # Permissions
  permission_handler: ^11.0.1

  # Utils
  intl: ^0.18.1
  uuid: ^4.2.1
  logger: ^2.0.2+1
  connectivity_plus: ^5.0.2

  # TFLite for offline inference
  tflite_flutter: ^0.10.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  riverpod_generator: ^2.3.3
  flutter_lints: ^3.0.0
  mockito: ^5.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/animations/
    - assets/models/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
